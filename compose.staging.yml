services:
  postgres:
    image: postgres:18
    container_name: specbookdb
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER:-specbook}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-specbook}
    volumes:
      - specbookdb_data:/var/lib/postgresql
    networks:
      - staging_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-specbook} -d ${DB_NAME:-specbook}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: specbookredis
    env_file:
      - .env
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes'
    volumes:
      - specbookredis_data:/data
    networks:
      - staging_network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # One-shot migration runner. Reuses the API image but overrides the
  # entrypoint to apply migrations and exit. Runs exactly once before api/worker
  # start, so multiple api replicas never race to migrate.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: specbookmigrate
    env_file:
      - .env
    # Override host-loopback values from .env: on the compose network the DB is
    # reachable by service name, not 127.0.0.1. Build the URL from DB_PASSWORD so
    # it always matches what Postgres was initialized with.
    environment:
      DATABASE_URL: postgresql://${DB_USER:-specbook}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-specbook}
    entrypoint: ['node', '/app/packages/database/dist/cli/migrate.mjs']
    networks:
      - staging_network
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # No container_name: it must be unique, which blocks `--scale api=N`.
    # Compose auto-names replicas (valmatic-dev-api-1, -2, …).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      # See migrate service: reach backing services by name, not 127.0.0.1.
      DATABASE_URL: postgresql://${DB_USER:-specbook}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-specbook}
      REDIS_HOST: redis
      IAM_REDIS_HOST: redis
    # Single instance for now — one upstream for the host proxy. To scale:
    # widen to '127.0.0.1:3031-3035:3000' and run compose up --scale api=N
    # (the range gives each replica its own loopback port).
    # Host ports are .env-configurable (WEB_HOST_PORT / API_HOST_PORT) —
    # several apps share one VM; the allocation on the box: solmond 3010s,
    # valmonto-bots 3020s, specbook 3030s, woxios 5100s, servicebook 5200s.
    # The host proxy is the only public listener.
    ports:
      - '127.0.0.1:${API_HOST_PORT:-3031}:3000'
    networks:
      - staging_network
    # Without this, `docker compose up --wait` only waits for the container to
    # be *running*, so an api that boots and then fails its first request still
    # reports a green deploy. Uses node's global fetch — no curl/wget in the
    # alpine runtime image.
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: specbookweb
    env_file:
      - .env
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:${WEB_HOST_PORT:-3030}:3000'
    networks:
      - staging_network
    depends_on:
      - api
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    # No container_name so the worker can also scale (--scale worker=N).
    # It publishes no host port, so replicas don't conflict.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      # See migrate service: reach backing services by name, not 127.0.0.1.
      DATABASE_URL: postgresql://${DB_USER:-specbook}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-specbook}
      REDIS_HOST: redis
      IAM_REDIS_HOST: redis
    networks:
      - staging_network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  specbookdb_data:
  specbookredis_data:

networks:
  staging_network:
    driver: bridge
